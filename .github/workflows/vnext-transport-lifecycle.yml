name: vNext transport lifecycle slice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Transport lifecycle (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
            proof_arguments: ""
            safety_arguments: ""
          - compiler: clang-18-ASan-UBSan
            cc: clang-18
            cxx: clang++-18
            proof_arguments: --sanitize
            safety_arguments: -DTES3MP_ENABLE_ASAN_UBSAN=ON
          - compiler: gcc-13-TSan
            cc: gcc-13
            cxx: g++-13
            proof_arguments: ""
            safety_arguments: -DTES3MP_ENABLE_TSAN=ON
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1:abort_on_error=1

    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install the approved compiler family and build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes "${{ matrix.cc }}" "${{ matrix.cxx }}" cmake ninja-build make perl

      - name: Rebuild the exact dependency proofs
        run: |
          python3 scripts/run_vnext_gamenetworkingsockets_proof.py ${{ matrix.proof_arguments }}
          python3 scripts/run_vnext_cares_proof.py ${{ matrix.proof_arguments }}

      - name: Provision the verified production inputs
        run: python3 scripts/provision_vnext_transport.py

      - name: Configure the selected adapter
        run: >-
          cmake -S components/tes3mp -B build/vnext-transport-lifecycle -G Ninja
          -DTES3MP_ENABLE_GNS_TRANSPORT=ON
          -DTES3MP_TRANSPORT_DEPENDENCY_MANIFEST=${{ github.workspace }}/build/vnext-transport-dependencies/manifest.json
          ${{ matrix.safety_arguments }}

      - name: Build and run focused lifecycle checks
        run: |
          cmake --build build/vnext-transport-lifecycle --target tes3mp_transport_lifecycle_tests tes3mp_transport_gns_schedule_tests tes3mp_transport_gns_tests --parallel 2
          ./build/vnext-transport-lifecycle/tes3mp_transport_lifecycle_tests
          ./build/vnext-transport-lifecycle/tes3mp_transport_gns_schedule_tests
          ./build/vnext-transport-lifecycle/tes3mp_transport_gns_tests
          python3 -m unittest scripts.tests.test_tes3mp_target_boundaries
          python3 scripts/verify_vnext_baseline.py

      - name: Retain exact dependency and adapter evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vnext-transport-lifecycle-${{ matrix.compiler }}-${{ github.sha }}
          path: |
            build/vnext-transport-dependencies/manifest.json
            build/vnext-gamenetworkingsockets-proof/evidence/*
            build/vnext-cares-proof/evidence/*
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Transport lifecycle (MSVC 2022 v143)
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Enter the Visual Studio 2022 x64 developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
          vsversion: "2022"

      - name: Rebuild and provision the exact dependency inputs
        run: |
          python scripts/run_vnext_gamenetworkingsockets_proof.py
          python scripts/run_vnext_cares_proof.py
          python scripts/provision_vnext_transport.py

      - name: Configure the selected adapter
        run: >-
          cmake -S components/tes3mp -B build/vnext-transport-lifecycle -G Ninja
          -DTES3MP_ENABLE_GNS_TRANSPORT=ON
          -DTES3MP_TRANSPORT_DEPENDENCY_MANIFEST=${{ github.workspace }}/build/vnext-transport-dependencies/manifest.json

      - name: Build and run focused lifecycle checks
        run: |
          cmake --build build/vnext-transport-lifecycle --target tes3mp_transport_lifecycle_tests tes3mp_transport_gns_schedule_tests tes3mp_transport_gns_tests --parallel 2
          .\build\vnext-transport-lifecycle\tes3mp_transport_lifecycle_tests.exe
          .\build\vnext-transport-lifecycle\tes3mp_transport_gns_schedule_tests.exe
          .\build\vnext-transport-lifecycle\tes3mp_transport_gns_tests.exe
          python -m unittest scripts.tests.test_tes3mp_target_boundaries
          python scripts/verify_vnext_baseline.py

      - name: Retain exact dependency and adapter evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vnext-transport-lifecycle-msvc-2022-v143-${{ github.sha }}
          path: |
            build/vnext-transport-dependencies/manifest.json
            build/vnext-gamenetworkingsockets-proof/evidence/*
            build/vnext-cares-proof/evidence/*
          if-no-files-found: error
          retention-days: 30

  macos-arm64:
    name: Transport lifecycle (macOS arm64, Xcode 16)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.8"

    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Select Xcode 16 and install build tools
        run: |
          sudo xcode-select -s "$(find /Applications -maxdepth 1 -type d -name 'Xcode_16*.app' | sort | tail -1)/Contents/Developer"
          brew install cmake ninja
      - name: Rebuild, provision, build, and test the adapter
        run: |
          python3 scripts/run_vnext_gamenetworkingsockets_proof.py
          python3 scripts/run_vnext_cares_proof.py
          python3 scripts/provision_vnext_transport.py
          cmake -S components/tes3mp -B build/vnext-transport-lifecycle -G Ninja -DTES3MP_ENABLE_GNS_TRANSPORT=ON -DTES3MP_TRANSPORT_DEPENDENCY_MANIFEST="$PWD/build/vnext-transport-dependencies/manifest.json"
          cmake --build build/vnext-transport-lifecycle --target tes3mp_transport_lifecycle_tests tes3mp_transport_gns_schedule_tests tes3mp_transport_gns_tests --parallel 2
          ./build/vnext-transport-lifecycle/tes3mp_transport_lifecycle_tests
          ./build/vnext-transport-lifecycle/tes3mp_transport_gns_schedule_tests
          ./build/vnext-transport-lifecycle/tes3mp_transport_gns_tests
          python3 -m unittest scripts.tests.test_tes3mp_target_boundaries
          python3 scripts/verify_vnext_baseline.py
      - name: Retain exact dependency and adapter evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vnext-transport-lifecycle-macos-arm64-${{ github.sha }}
          path: |
            build/vnext-transport-dependencies/manifest.json
            build/vnext-gamenetworkingsockets-proof/evidence/*
            build/vnext-cares-proof/evidence/*
          if-no-files-found: error
          retention-days: 30

  macos-x86-64:
    name: Transport lifecycle (macOS x86-64, Xcode 16)
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.7"

    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Select Xcode 16 and install build tools
        run: |
          sudo xcode-select -s "$(find /Applications -maxdepth 1 -type d -name 'Xcode_16*.app' | sort | tail -1)/Contents/Developer"
          brew install cmake ninja
      - name: Rebuild, provision, build, and test the adapter
        run: |
          python3 scripts/run_vnext_gamenetworkingsockets_proof.py
          python3 scripts/run_vnext_cares_proof.py
          python3 scripts/provision_vnext_transport.py
          cmake -S components/tes3mp -B build/vnext-transport-lifecycle -G Ninja -DTES3MP_ENABLE_GNS_TRANSPORT=ON -DTES3MP_TRANSPORT_DEPENDENCY_MANIFEST="$PWD/build/vnext-transport-dependencies/manifest.json"
          cmake --build build/vnext-transport-lifecycle --target tes3mp_transport_lifecycle_tests tes3mp_transport_gns_schedule_tests tes3mp_transport_gns_tests --parallel 2
          ./build/vnext-transport-lifecycle/tes3mp_transport_lifecycle_tests
          ./build/vnext-transport-lifecycle/tes3mp_transport_gns_schedule_tests
          ./build/vnext-transport-lifecycle/tes3mp_transport_gns_tests
          python3 -m unittest scripts.tests.test_tes3mp_target_boundaries
          python3 scripts/verify_vnext_baseline.py
      - name: Retain exact dependency and adapter evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vnext-transport-lifecycle-macos-x86-64-${{ github.sha }}
          path: |
            build/vnext-transport-dependencies/manifest.json
            build/vnext-gamenetworkingsockets-proof/evidence/*
            build/vnext-cares-proof/evidence/*
          if-no-files-found: error
          retention-days: 30
